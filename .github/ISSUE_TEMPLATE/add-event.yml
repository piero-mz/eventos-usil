name: Agregar Evento
description: Proponer un nuevo evento tech para publicar en el sitio
title: "[EVENTO] "
labels: ["evento", "jules"]
body:
  - type: markdown
    attributes:
      value: Completa el formulario y un mantenedor revisara tu propuesta. Gracias por contribuir!

  - type: textarea
    id: description
    attributes:
      label: Descripcion
      placeholder: Describe brevemente el evento.
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Fecha
      description: Formato YYYY-MM-DD
      placeholder: "2026-09-15"
    validations:
      required: true

  - type: input
    id: time
    attributes:
      label: Hora de inicio
      description: Formato HH:MM en 24 horas
      placeholder: "18:00"
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Modalidad
      options:
        - Presencial
        - Virtual
        - Hibrido
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Lugar
      description: Para eventos Presenciales o Hibridos. Dejar vacio si es Virtual.
      placeholder: ej. Auditorio Principal - Sede Miraflores
    validations:
      required: false

  - type: input
    id: meeting_url
    attributes:
      label: Link de la reunion
      description: Para eventos Virtuales o Hibridos. Dejar vacio si es Presencial.
      placeholder: "https://zoom.us/... o https://meet.google.com/..."
    validations:
      required: false

  - type: dropdown
    id: is_free
    attributes:
      label: El evento es gratuito?
      options:
        - "Si, es gratuito"
        - "No, tiene costo"
    validations:
      required: true

  - type: input
    id: price
    attributes:
      label: Precio
      description: Solo si el evento tiene costo. Dejar vacio si es gratuito.
      placeholder: "S/ 30"
    validations:
      required: false

  - type: input
    id: registration_url
    attributes:
      label: URL de registro o mas informacion
      description: Opcional - dejar vacio si es de entrada libre
      placeholder: "https://forms.gle/... o https://eventbrite.com/..."
    validations:
      required: false

  - type: textarea
    id: image_url
    attributes:
      label: Imagen del evento
      description: "Opcional - Arrastra tu flyer o logo directamente aqui. GitHub lo sube automaticamente."
      placeholder: "Arrastra la imagen aqui o pega una URL..."
    validations:
      required: false

  - type: checkboxes
    id: tags
    attributes:
      label: Temas del
